server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-cache the fingerprinted Vite assets; a missing asset is a real 404
    # (don't fall through to index.html for them).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every other path is handled by react-router on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
